<title>Pillar</title>
<!-- Safe areas. Native overrides these on <html> the moment the webview mounts
     (or via the `host.safearea` emit, which app.js applies identically). The
     env() + floor keeps a plain desktop browser honest. -->
<style>
  :root {
    --sa-top: max(env(safe-area-inset-top, 0px), 20px);
    --sa-bottom: max(env(safe-area-inset-bottom, 0px), 8px);
  }
  /* Painted before the stylesheet lands so a slow first paint is never white. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #FBFAF6; }
</style>
<link rel="stylesheet" href="./app-HKAVNGUM.css">
</head>
<body>
<main id="root"></main>

</body>
